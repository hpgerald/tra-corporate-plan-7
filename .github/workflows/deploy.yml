# NOT USED — this project deploys via the gh-pages branch (`npm run deploy`),
# with GitHub Pages set to "Deploy from a branch". See DEPLOY.md.
#
# This workflow is kept manual-only (workflow_dispatch) so it never runs on push
# and cannot conflict with branch deployment. You can safely delete the whole
# .github/ folder if you prefer.
name: (disabled) build check

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
